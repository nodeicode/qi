name: CI — Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel redundant runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Run tests
        # The runner (quant/tests/_runner.py) runs the engine/data/backtest
        # and live suites; the coverage gate is enforced by the pytest config.
        run: uv run test