name: CI — Test Suite

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - staging

# Cancel redundant runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12
        working-directory: python

      - name: Install dependencies
        run: uv sync --python 3.12 --group dev
        working-directory: python

      - name: Run ruff
        run: uv run --python 3.12 ruff check .
        working-directory: python

      - name: Run ty
        run: uv run --python 3.12 ty check
        working-directory: python

      - name: Run tests
        run: |
          set +e
          uv run --python 3.12 pytest tests -v --tb=short 2>&1 | tee test_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            if grep -q "not reached" test_output.txt; then
              echo "ERROR: Coverage is below the required 90% threshold. Add tests to cover the missing lines and branches before merging."
            else
              echo "ERROR: One or more tests failed. See the test output above for details."
            fi
            exit $EXIT_CODE
          fi
        working-directory: python
