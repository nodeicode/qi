# Dependabot configuration — security-first, stability-focused
# ─────────────────────────────────────────────────────────────
# Security updates:  Enabled via repo Settings > Code security > Dependabot.
#                    These PRs are opened immediately when a CVE is published,
#                    regardless of schedule or open-pull-requests-limit.
#
# Version updates:   Monthly cadence below keeps deps from drifting too far
#                    without churn.  Routine bumps are grouped into one PR.
# ─────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: "uv" # reads pyproject.toml + uv.lock
    directory: "/"
    schedule:
      interval: "monthly"
    # Only widen version constraints when the new (security) version requires it.
    # Existing == pins stay untouched unless a fix demands a newer release.
    versioning-strategy: "increase-if-necessary"
    # Cap routine PRs; security PRs always bypass this limit.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Bundle all non-security minor/patch bumps into a single monthly PR
      routine:
        update-types:
          - "minor"
          - "patch"
