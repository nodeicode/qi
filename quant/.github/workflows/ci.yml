name: CI — Test Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel redundant runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12  # dev group is the default sync group

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Build native kernels
        # setup.py resolves the in-place .so via the qualified ext name
        # (quant/utils/cpp_native/) relative to cwd — must run from src/.
        run: cd src && uv run --python 3.12 python quant/utils/cpp_native/setup.py build_ext --inplace

      - name: Run ruff
        run: uv run --python 3.12 ruff check .

      - name: Check formatting
        run: uv run --python 3.12 ruff format --check .

      - name: Run ty
        run: uv run --python 3.12 ty check

      - name: Run tests
        run: |
          set +e
          uv run --python 3.12 pytest tests -v --tb=short 2>&1 | tee test_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            if grep -q "not reached" test_output.txt; then
              echo "ERROR: Coverage is below the required 90% threshold. Add tests to cover the missing lines and branches before merging."
            else
              echo "ERROR: One or more tests failed. See the test output above for details."
            fi
            exit $EXIT_CODE
          fi
